<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    
  
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f8f9fa;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url("https://images.creativemarket.com/0.1.0/ps/6715930/1820/1213/m1/fpnw/wm1/vehdb4tur0fg6yphaiumv2bmtplollhqll0gvubgxt58t7znz43m5enjos1cxcdn-.jpg?1563755523&s=8f3348cf882152190120732385c2afd2") 
                  no-repeat center center/cover;
      position: relative;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    main .container {
      position: relative;
      z-index: 1;
      color: white;
    }
    footer {
      background: #343a40;
      color: #fff;
      padding: 30px 0;
      text-align: center;
    }
    .navbar-brand img { height: 40px; }
    .navbar-brand h1 { font-size: 50%; }

    /* Floating Chatbot Button */
    #chatbot-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      font-size: 24px;
    }

    /* Chatbot Container */
    #chatbot {
      display: none;  /* hidden by default */
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 500px;
      background: #000;  /* black background */
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }

    #chatbot-header {
      background: #111;
      color: #fff;
      padding: 12px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatbot-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #fff;
      color: #eee;
      font-size: 14px;
    }

    #chatbot-body .message {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    #chatbot-body .user {
      background: #444;
      color: #fff;
      margin-left: auto;
      text-align: right;
    }

    #chatbot-body .bot {
      background: #222;
      color: #eee;
      margin-right: auto;
      text-align: left;
    }

    #chatbot-footer {
      display: flex;
      padding: 8px;
      background: #111;
    }

    #chatInput {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      margin: 0 5px;
    }

    #chatInput::placeholder {
      color: #bbb;
    }

    #sendBtn, #uploadBtn {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    #sendBtn:hover, #uploadBtn:hover {
      background: #666;
    }
    
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="https://static.vecteezy.com/system/resources/previews/006/996/177/original/gear-cog-factory-industry-for-industrial-logo-design-vector.jpg" alt="Company Logo"  >
        <h1>Industry Company </h1>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">AboutUs</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">ContactUs</a></li>
          <li class="nav-item"><a class="nav-link" href="/business">Business</a></li>
          <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="container">
      <h1 class="display-4 fw-bold">Welcome to Our Company</h1>
      <p class="lead">We deliver innovative solutions for your business success.</p>
      <a href="#" class="btn btn-primary btn-lg m-2">Get Started</a>
      <a href="#" class="btn btn-outline-light btn-lg m-2 bg-dark">Learn More</a>
    </div>
  </main>

  <!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span id="closeModal">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Login</button>
        </form>
    </div>
</div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-0">© 2025 Your Company. All Rights Reserved.</p>
    </div>
  </footer>
  
  <!-- Floating Chatbot Button -->
  <div id="chatbot-btn">💬</div>

  <!-- Chatbot Widget -->
  <div id="chatbot">
    <div id="chatbot-header">
      💬 Chatbot
      <span style="cursor:pointer;" onclick="toggleChat()">✖</span>
    </div>
    <div id="chatbot-body"></div>
    <div id="chatbot-footer">
      <input type="file" id="fileInput" style="display:none;">
      <button id="uploadBtn">📁</button>
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button id="sendBtn">➤</button>
    </div>
  </div>


  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  const chatBox = document.getElementById("chatbot");
  const chatBtn = document.getElementById("chatbot-btn");
  const chatBody = document.getElementById("chatbot-body");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const uploadBtn = document.getElementById("uploadBtn");
  const fileInput = document.getElementById("fileInput");

  function toggleChat() {
    chatBox.style.display = (chatBox.style.display === "flex") ? "none" : "flex";
  }
  chatBtn.addEventListener("click", toggleChat);

  function appendMessage(sender, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerText = text;
    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  async function sendMessageToBot(message) {
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      return data.reply;
    } catch (err) {
      return "⚠️ Error: Could not connect to server.";
    }
  }

  sendBtn.addEventListener("click", async () => {
    const text = chatInput.value.trim();
    if (text) {
      appendMessage("user", text);
      chatInput.value = "";
      const botReply = await sendMessageToBot(text);
      appendMessage("bot", botReply);
    }
  });

  chatInput.addEventListener("keypress", e => { if (e.key === "Enter") sendBtn.click(); });

  uploadBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      appendMessage("user", "📎 Uploaded: " + file.name);
      let formData = new FormData();
      formData.append("file", file);
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      appendMessage("bot", data.reply);
    }
  });
</script>

</body>
</html>
