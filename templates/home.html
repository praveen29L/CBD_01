<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f8f9fa;
    }
   
    main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: url("https://images.creativemarket.com/0.1.0/ps/6715930/1820/1213/m1/fpnw/wm1/vehdb4tur0fg6yphaiumv2bmtplollhqll0gvubgxt58t7znz43m5enjos1cxcdn-.jpg?1563755523&s=8f3348cf882152190120732385c2afd2") 
              no-repeat center center/cover;
  position: relative;
}

main::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4); /* transparent overlay */
}

main .container {
  position: relative;
  z-index: 1;
  color: white; /* make text readable */
}

/* Modal */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
.modal-content { background: rgb(230, 223, 223); padding: 20px; margin: 15% auto; width: 300px; border-radius: 8px; }
#closeModal { float: right; cursor: pointer; }

    footer {
      background: #343a40;
      color: #fff;
      padding: 30px 0;
      text-align: center;
    }
    .navbar-brand img {
      height: 40px;
      justify-content:cen
    }
    .navbar-brand h1{
      font-size: 50%;
    }

    
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="https://static.vecteezy.com/system/resources/previews/006/996/177/original/gear-cog-factory-industry-for-industrial-logo-design-vector.jpg" alt="Company Logo"  >
        <h1>Industry Company </h1>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">AboutUs</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">ContactUs</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="/signup">Sign Up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="container">
      <h1 class="display-4 fw-bold">Welcome to Our Company</h1>
      <p class="lead">We deliver innovative solutions for your business success.</p>
      <a href="#" class="btn btn-primary btn-lg m-2">Get Started</a>
      <a href="#" class="btn btn-outline-light btn-lg m-2 bg-dark">Learn More</a>
    </div>
  </main>

  <!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span id="closeModal">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Login</button>
        </form>
    </div>
</div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-0">© 2025 Your Company. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let loginBtn = document.getElementById("loginBtn");
let modal = document.getElementById("loginModal");
let closeModal = document.getElementById("closeModal");

loginBtn.onclick = () => modal.style.display = "block";
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }
  </script>
</body>
</html>
